name: docker

on:
  pull_request:
    paths:
      - "docker/**"
      - "deploy/**"
      - "services/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "deploy/**"
      - "services/**"
      - "crates/**"
      - "Cargo.toml"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate stack files
        run: |
          for f in deploy/portainer/*.stack.yml deploy/portainer/examples/*.stack.yml; do
            echo "::group::$f"
            YM_CONFIG_FILE=/dev/null docker compose -f "$f" config -q
            echo "::endgroup::"
          done
      - name: shellcheck the entrypoint
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck docker/entrypoint.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build node image (and push on non-PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-proxy
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build runtime target (Rust yardmaster-dataplane) — verify only, no push
        # Not yet used by any deploy stack (YM_DATAPLANE_MODE=proxy is still
        # the default until the broker learns --dataplane-path, issue #26),
        # so nothing here needs a tag or a registry push — this step exists
        # purely so a change that breaks the Rust build fails CI instead of
        # going unnoticed until #26 lands and someone finally builds `runtime`.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=runtime
          provenance: false

      - name: Console image metadata
        id: cmeta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-console
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Build console image (and push on non-PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/yardmaster-console/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.cmeta.outputs.tags }}
          labels: ${{ steps.cmeta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
