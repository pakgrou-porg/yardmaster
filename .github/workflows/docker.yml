name: docker

on:
  pull_request:
    paths:
      - "docker/**"
      - "deploy/**"
      - "services/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "deploy/**"
      - "services/**"
      - "crates/**"
      - "Cargo.toml"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate stack files
        run: |
          for f in deploy/portainer/*.stack.yml; do
            echo "::group::$f"
            YM_CONFIG_FILE=/dev/null docker compose -f "$f" config -q
            echo "::endgroup::"
          done
      - name: shellcheck the entrypoint
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck docker/entrypoint.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build (and push on non-PR)
        # continue-on-error until the Rust workspace compiles (issue #36).
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
