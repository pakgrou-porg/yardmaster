yardmaster-ollama-translation.workspace = true
yardmaster-cluster-trust.workspace = true
yardmaster-control-client.workspace = true
yardmaster-providers.workspace = true
yardmaster-plan-execute.workspace = true
yardmaster-metrics.workspace = true
yardmaster-cost.workspace = true
tokio.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower = { version = "0.5", features = ["limit", "timeout"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest.workspace = true
