#
# cargo-deny configuration. Runs in CI (rust job) and blocks merge.
# See docs/decisions/0004-*.md and SECURITY.md ("Supply chain").

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only. Copyleft is denied by omission.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # webpki-root-certs (transitive, via reqwest's rustls-platform-verifier):
    # a data-only crate (a bundle of root certificates), not code; permissive.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# rustls only; no native-tls / openssl in the dependency graph.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/NVIDIA-NeMo/Switchyard",
]
