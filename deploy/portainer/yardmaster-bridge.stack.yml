#
# Bridge-network variant — for Docker Swarm, or hosts where a shared network
# namespace / host networking is not acceptable.
#
# Trade-offs you accept here:
#   * The broker's auto-advertise loop probes `127.0.0.1:11434` for the local
#     engine. On a bridge the engine is at `ollama:11434`, NOT loopback, so the
#     proxy is NOT auto-wired to it. You must add the engine as a manual node or
#     wait for YM_DATAPLANE_MODE=dataplane (issue #47 / #26).
#   * mDNS discovery does not cross the bridge — no automatic node/endpoint
#     discovery. Use manual nodes and pair by address.
#   * Keep `[discovery] lan_scan = false` (the container subnet is not your LAN).
#
# For a single box, prefer deploy/portainer/yardmaster-node.stack.yml.

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 5

  yardmaster:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: docker/Dockerfile
      target: runtime-proxy
    image: yardmaster:proxy-local
    restart: unless-stopped
    # NOTE: the proxy refuses non-loopback plaintext with 403 (PAIR security
    # model). On a bridge every request is non-loopback, so publishing 11435
    # only works for paired cluster peers over mTLS. For plain LAN clients use
    # the shared-namespace node stack (which runs yardmaster-lan-shim), or add
    # your own socat sidecar in this container's netns, or use Ollama-direct.
    ports:
      - "${YM_PROXY_PORT:-11435}:11435"
    environment:
      NVPAIR_LOG_LEVEL: info
      YM_DATAPLANE_MODE: proxy
      YM_HEALTHCHECK_URL: http://127.0.0.1:11435/api/tags
    volumes:
      - yardmaster-data:/data

  yardmaster-console:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: packages/yardmaster-console/Dockerfile
    image: yardmaster-console:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${YM_CONSOLE_PORT:-8770}:8770"
    environment:
      YM_CONSOLE_BIND: 0.0.0.0
      YM_LOCAL_ENGINE_URL: http://ollama:11434
      YM_AGENT_URL: ${YM_AGENT_URL:-http://127.0.0.1:3080}
      YM_METRICS_DB: "/data/Nvidia Corporation/Personal AI Router/yardmaster-metrics.db"
    volumes:
      - yardmaster-data:/data

volumes:
  ollama-models: { name: yardmaster-ollama-models }
  yardmaster-data: { name: yardmaster-data }
