#
# Yardmaster single node — Portainer stack. One Docker host = one node; deploy
# this on each machine you want in the cluster and pair them with the PIN.
#
# THREE containers (ADR-0026), zero manual steps:
#   ollama              the engine. Owns the network namespace.
#   yardmaster          PAIR broker + proxy + router + Console + a LAN bridge.
#                       Self-chowns its volume, drops to uid 10001. Also runs
#                       the capability registry (ADR-0028) that discovers and
#                       writes the Harness's model list.
#   yardmaster-harness  `dsh web` auto-pointed at Yardmaster, behind Basic Auth.
#
# Ports (published on `ollama`):
#   11435 -> LAN bridge -> 127.0.0.1:4000 router   inference clients (autorouting)
#    8770  Yardmaster Console                       ${YM_BIND} (default 127.0.0.1)
#    3080  DeepSeek Harness                         ${YM_BIND}
#
# Env: YM_BIND (0.0.0.0 for LAN), YM_LAN_HOST (<this-host-ip>),
#      YM_HARNESS_DEFAULT_MODEL (fallback for [harness].default_model),
#      YM_AUTH_USER / YM_AUTH_PASS (pre-seed; else a one-time setup page),
#      YM_AUTH_DISABLED=1 (loopback dev only), OPENROUTER_API_KEY.
#
# AUTH IS ON BY DEFAULT — one admin credential (scrypt hash on the data volume)
# protects both the Console and the Harness. GPU box (ROCm/CUDA): see
# deploy/portainer/examples/framework-strix-halo.stack.yml.

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: yardmaster-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_KEEP_ALIVE: "30m"
      # Cap the context. Ollama's "vram-based default" can be enormous on a
      # big-VRAM box / iGPU and some backends return garbage at that size.
      OLLAMA_CONTEXT_LENGTH: "16384"
    ports:
      - "11435:11430"                              # inference proxy -> LAN
      - "${YM_BIND:-127.0.0.1}:8770:8770"          # Yardmaster Console
      - "${YM_BIND:-127.0.0.1}:3080:3081"          # DeepSeek Harness
      # - "11434:11434"                            # Ollama direct, optional
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 5

  yardmaster:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: docker/Dockerfile
      target: runtime-proxy
    image: yardmaster:proxy-local
    pull_policy: build             # built here, never pulled from a registry
    container_name: yardmaster
    restart: unless-stopped
    network_mode: "service:ollama"
    user: "0:0"                     # root to chown the volume, then drops to 10001
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      NVPAIR_LOG_LEVEL: info
      # router = PAIR proxy + the interim Node data plane (config-driven
      # autorouting by model id; passthrough + escalation; metrics).
      YM_DATAPLANE_MODE: router
      YM_ROUTER_PORT: "4000"
      YM_ROUTER_BIND: 127.0.0.1        # 0.0.0.0 exposes autorouting (incl. cloud egress) on :11435
      YM_LOCAL_ENGINE_URL: http://127.0.0.1:11434
      YM_PROXY_PORT: "11435"
      YM_LAN_BRIDGE_PORT: "11430"
      YM_HEALTHCHECK_URL: http://127.0.0.1:4000/healthz
      YM_CONSOLE_PORT: "8770"
      YM_CONSOLE_BIND: 0.0.0.0
      YM_AGENT_PORT: "3080"
      YM_HARNESS_URL_FILE: /dshhome/web-url
      YM_CONFIG_PATH: /config/yardmaster.toml
      YM_CONFIG_FALLBACK: "/data/Nvidia Corporation/Personal AI Router/yardmaster.toml"
      YM_METRICS_DB: "/data/Nvidia Corporation/Personal AI Router/yardmaster-metrics.db"
      # Capability registry (ADR-0028): discovers the Harness's model list from
      # yardmaster.toml + live provider probes, writes it into cordis.patch.yml.
      # Prefer [harness].default_model in the TOML; this is only a fallback.
      YM_HARNESS_DEFAULT_MODEL: "${YM_HARNESS_DEFAULT_MODEL:-deepseek-r1:32b}"
      YM_AUTH_USER: "${YM_AUTH_USER:-}"
      YM_AUTH_PASS: "${YM_AUTH_PASS:-}"
      YM_AUTH_DISABLED: "${YM_AUTH_DISABLED:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    volumes:
      - yardmaster-data:/data
      - yardmaster-harness:/dshhome                 # rw: writes the Harness's model list (ADR-0028)
      # Manage yardmaster.toml from the host (keep :ro,Z for SELinux):
      # - /etc/yardmaster/yardmaster.toml:/config/yardmaster.toml:ro,Z

  yardmaster-harness:
    build:                              # same image as `yardmaster` — Compose builds it once
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: docker/Dockerfile
      target: runtime-proxy
    image: yardmaster:proxy-local        # overrides the entrypoint below
    pull_policy: build
    container_name: yardmaster-harness
    restart: unless-stopped
    network_mode: "service:ollama"
    user: "0:0"
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/yardmaster-harness-entrypoint"]
    depends_on:
      ollama: { condition: service_healthy }
      yardmaster: { condition: service_healthy }
    environment:
      DSH_HOME: /dshhome
      YM_HARNESS_PORT: "3080"
      YM_HARNESS_PROXY_PORT: "3081"
      YM_HARNESS_TRUSTED_HOSTS: "127.0.0.1:3080 ${YM_LAN_HOST:-}:3080"
      # No model config here — the `yardmaster` container's capability
      # registry (ADR-0028) writes the Harness's model list directly into this
      # volume. Set the default via [harness].default_model in yardmaster.toml,
      # or YM_HARNESS_DEFAULT_MODEL on the `yardmaster` service.
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"          # for the Brave Search MCP server (see docs; cordis.user.yml)
      YM_AUTH_USER: "${YM_AUTH_USER:-}"
      YM_AUTH_PASS: "${YM_AUTH_PASS:-}"
    volumes:
      - yardmaster-harness:/dshhome
      - yardmaster-data:/data:ro                    # read the shared admin credential

volumes:
  ollama-models: { name: yardmaster-ollama-models }
  yardmaster-data: { name: yardmaster-data }
  yardmaster-harness: { name: yardmaster-harness }
