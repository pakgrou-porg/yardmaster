#
# Yardmaster single node — Portainer stack. One Docker host = one node; deploy
# this on each machine you want in the cluster and pair them with the PIN.
#
# Topology: the `ollama` service owns the network namespace; `yardmaster` (the
# broker + proxy) and `yardmaster-console` share it (`network_mode:
# service:ollama`). That is deliberate — the `yardmaster` entrypoint registers
# the local engine as a manual node at `127.0.0.1:11434` (from
# `YM_LOCAL_ENGINE_URL`), so engine and proxy must share loopback. It also holds
# the broker's stdin open via a FIFO, so no `stdin_open` / `tty` is needed.
# See docs/decisions/0024-container-sibling-engine-wiring.md.
#
# The proxy refuses non-loopback plaintext (403 — PAIR's security model). The
# `yardmaster-lan-shim` socat sidecar forwards LAN traffic through loopback so
# the proxy accepts it.
#
# Ports (all published on the `ollama` service, which owns the namespace):
#   11435 -> shim :11430 -> proxy :11435   <-- point LAN clients here
#    8770  the Yardmaster Console (loopback-published; widen at your own risk)
#   11434  Ollama direct (optional; commented out)
#    3080  the DeepSeek Harness Web UI, if you run it (see docs/deployment-docker.md)
#
# CPU-only box: drop the `devices` / `group_add` from `ollama`. GPU box: see
# deploy/portainer/examples/framework-strix-halo.stack.yml.

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: yardmaster-ollama
    restart: unless-stopped
    ipc: host
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"     # loopback inside the shared namespace
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "3"
      OLLAMA_NUM_PARALLEL: "4"
    ports:
      - "11435:11430"                    # LAN -> yardmaster-lan-shim -> loopback proxy
      - "127.0.0.1:8770:8770"            # the Console, host-loopback only
      # - "11434:11434"                  # uncomment for Ollama direct
      # - "127.0.0.1:3080:3080"          # uncomment if you run dsh in-namespace
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 5

  yardmaster-init:
    image: alpine:latest
    container_name: yardmaster-init
    command: sh -c "chown -R 10001:10001 /data"
    volumes:
      - yardmaster-data:/data

  yardmaster:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: docker/Dockerfile
      target: runtime-proxy
    image: yardmaster:proxy-local
    container_name: yardmaster
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster-init: { condition: service_completed_successfully }
      ollama: { condition: service_healthy }
    environment:
      NVPAIR_LOG_LEVEL: info
      YM_DATAPLANE_MODE: proxy
      YM_LOCAL_ENGINE_URL: http://127.0.0.1:11434
      YM_HEALTHCHECK_URL: http://127.0.0.1:11435/api/tags
    volumes:
      - yardmaster-data:/data

  # Loopback -> LAN bridge for the proxy (see the header comment).
  yardmaster-lan-shim:
    image: alpine/socat:latest
    container_name: yardmaster-lan-shim
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster: { condition: service_started }
    command: ["-d", "TCP-LISTEN:11430,fork,reuseaddr", "TCP:127.0.0.1:11435"]

  yardmaster-console:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: packages/yardmaster-console/Dockerfile
    image: yardmaster-console:local
    container_name: yardmaster-console
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster: { condition: service_started }
    environment:
      YM_CONSOLE_PORT: "8770"
      YM_CONSOLE_BIND: 0.0.0.0
      YM_LOCAL_ENGINE_URL: http://127.0.0.1:11434
      YM_AGENT_URL: http://127.0.0.1:3080
      YM_CONFIG_PATH: /config/yardmaster.toml
      YM_CONFIG_FALLBACK: "/data/Nvidia Corporation/Personal AI Router/yardmaster.toml"
      YM_METRICS_DB: "/data/Nvidia Corporation/Personal AI Router/yardmaster-metrics.db"
      # The Console uses its built-in validator. It only shells out to a real
      # `yardmaster-dataplane dry-run` if you mount that binary in and set
      # YM_DATAPLANE_BIN to its path.
    volumes:
      - yardmaster-data:/data
      # Manage yardmaster.toml from the host (keep :ro,Z for SELinux). The
      # Console writes the data-dir fallback copy when this is read-only.
      # - /etc/yardmaster/yardmaster.toml:/config/yardmaster.toml:ro,Z

volumes:
  ollama-models: { name: yardmaster-ollama-models }
  yardmaster-data: { name: yardmaster-data }
