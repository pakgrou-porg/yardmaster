#
# Yardmaster single node — Portainer stack. One Docker host = one node; deploy
# this on each machine you want in the cluster and pair them with the PIN.
#
# Topology: the `ollama` service owns the network namespace; `yardmaster` (the
# broker + proxy) and `yardmaster-console` share it (`network_mode:
# service:ollama`). That is deliberate — the `yardmaster` entrypoint registers
# the local engine as a manual node at `127.0.0.1:11434` (from
# `YM_LOCAL_ENGINE_URL`), so engine and proxy must share loopback. It also holds
# the broker's stdin open via a FIFO, so no `stdin_open` / `tty` is needed.
# See docs/decisions/0024-container-sibling-engine-wiring.md.
#
# The proxy refuses non-loopback plaintext (403 — PAIR's security model). The
# `yardmaster-lan-shim` socat sidecar forwards LAN traffic through loopback so
# the proxy accepts it.
#
# Ports (all published on the `ollama` service, which owns the namespace):
#   11435 -> yardmaster-lan-shim -> proxy   <-- point LAN inference clients here
#    8770  the Yardmaster Console                (${YM_BIND}, default 127.0.0.1)
#    3080  the DeepSeek Harness Web UI           (${YM_BIND}, default 127.0.0.1)
#
# LAN ACCESS: set stack env  YM_BIND=0.0.0.0  to expose the Console + Harness to
# the LAN, and  YM_LAN_HOST=<this-host-ip>  so dsh trusts that authority.
# SECURITY: the Console has no auth; dsh runs model code behind only a token +
# cookie. Front them with an authenticating proxy or firewalld on a shared LAN.
#
# CPU-only box: this stack. GPU box (ROCm/CUDA): see
# deploy/portainer/examples/framework-strix-halo.stack.yml.

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: yardmaster-ollama
    restart: unless-stopped
    ipc: host
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"     # loopback inside the shared namespace
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "3"
      OLLAMA_NUM_PARALLEL: "4"
    ports:
      - "11435:11430"                          # inference proxy -> LAN
      - "${YM_BIND:-127.0.0.1}:8770:8770"      # Console
      - "${YM_BIND:-127.0.0.1}:3080:3081"      # DeepSeek Harness UI
      # - "11434:11434"                        # uncomment for Ollama direct
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 5

  yardmaster-init:
    image: alpine:latest
    container_name: yardmaster-init
    command: sh -c "chown -R 10001:10001 /data /dshhome"
    volumes:
      - yardmaster-data:/data
      - yardmaster-harness:/dshhome

  yardmaster:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: docker/Dockerfile
      target: runtime-proxy
    image: yardmaster:proxy-local
    container_name: yardmaster
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster-init: { condition: service_completed_successfully }
      ollama: { condition: service_healthy }
    environment:
      NVPAIR_LOG_LEVEL: info
      YM_DATAPLANE_MODE: proxy
      YM_LOCAL_ENGINE_URL: http://127.0.0.1:11434
      YM_HEALTHCHECK_URL: http://127.0.0.1:11435/api/tags
    volumes:
      - yardmaster-data:/data

  # Loopback -> LAN bridge for the proxy (see the header comment).
  yardmaster-lan-shim:
    image: alpine/socat:latest
    container_name: yardmaster-lan-shim
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster: { condition: service_started }
    command: ["-d", "TCP-LISTEN:11430,fork,reuseaddr", "TCP:127.0.0.1:11435"]

  # DeepSeek Harness Web UI. dsh binds 127.0.0.1 only (it executes model code).
  # The entrypoint captures dsh's announced URL (with its per-boot launch token)
  # to $DSH_HOME/web-url so the Console links to the current one. DSH_HOME is a
  # dedicated volume so the signed-cookie secret persists -> the browser session
  # survives restarts (paste the tokened URL once per browser).
  yardmaster-harness:
    image: yardmaster:proxy-local        # already bundles dsh + node
    container_name: yardmaster-harness
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster-init: { condition: service_completed_successfully }
      yardmaster: { condition: service_started }
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/yardmaster-harness-entrypoint"]
    environment:
      DSH_HOME: /dshhome
      YM_HARNESS_PORT: "3080"
      YM_HARNESS_TRUSTED_HOSTS: "127.0.0.1:3080 ${YM_LAN_HOST:-}:3080"
      # YM_HARNESS_EXTRA_ARGS: "--set agent-default-model.provider=openai --set agent-default-model.model=llama3.2:latest"
    volumes:
      - yardmaster-harness:/dshhome

  yardmaster-harness-shim:
    image: alpine/socat:latest
    container_name: yardmaster-harness-shim
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster-harness: { condition: service_started }
    command: ["-d", "TCP-LISTEN:3081,fork,reuseaddr", "TCP:127.0.0.1:3080"]

  yardmaster-console:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: packages/yardmaster-console/Dockerfile
    image: yardmaster-console:local
    container_name: yardmaster-console
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster: { condition: service_started }
      yardmaster-harness: { condition: service_started }
    environment:
      YM_CONSOLE_PORT: "8770"
      YM_CONSOLE_BIND: 0.0.0.0
      YM_LOCAL_ENGINE_URL: http://127.0.0.1:11434
      YM_AGENT_URL: http://127.0.0.1:3080        # fallback; host derived from the request
      YM_HARNESS_URL_FILE: /dshhome/web-url
      YM_CONFIG_PATH: /config/yardmaster.toml
      YM_CONFIG_FALLBACK: "/data/Nvidia Corporation/Personal AI Router/yardmaster.toml"
      YM_METRICS_DB: "/data/Nvidia Corporation/Personal AI Router/yardmaster-metrics.db"
    volumes:
      - yardmaster-data:/data
      - yardmaster-harness:/dshhome:ro
      # Manage yardmaster.toml from the host (keep :ro,Z for SELinux). The
      # Console writes the data-dir fallback copy when this is read-only.
      # - /etc/yardmaster/yardmaster.toml:/config/yardmaster.toml:ro,Z

volumes:
  ollama-models: { name: yardmaster-ollama-models }
  yardmaster-data: { name: yardmaster-data }
  yardmaster-harness: { name: yardmaster-harness }
