#
# Yardmaster + ROCm Ollama + Console on a Framework Desktop
# (AMD Ryzen AI Max+ 395 / "Strix Halo", Radeon 8060S iGPU, 128 GB unified
# memory), Fedora 44.
#
# GPU-tuned variant of deploy/portainer/yardmaster-node.stack.yml. Read
# docs/deployment-framework-strix-halo.md first (BIOS iGPU-memory carve-out,
# `setsebool container_use_devices`, firewalld, the gfx1151 override).
#
# Topology: `ollama` owns the network namespace; `yardmaster` (broker + proxy)
# and `yardmaster-console` share it. The broker's auto-advertise probes
# 127.0.0.1:11434, so the engine sits there and the proxy on 11435.
#
# Point LAN clients at http://<framework-ip>:11435
# Open the Console at    http://127.0.0.1:8770  (on the Framework itself)

services:
  ollama:
    image: docker.io/ollama/ollama:rocm
    container_name: yardmaster-ollama
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "39"        # video  -- verify: getent group video render
      - "105"       # render
    ipc: host
    # security_opt: ["seccomp=unconfined"]   # only if rocminfo fails on a syscall
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"          # loopback in the shared namespace
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "3"
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_FLASH_ATTENTION: "1"
      # HSA_OVERRIDE_GFX_VERSION: "11.5.1"    # set if model loads fall back to CPU
    ports:
      - "11435:11435"                         # Yardmaster proxy -> your LAN
      - "127.0.0.1:8770:8770"                 # Console -> Framework loopback only
      # - "11434:11434"                       # Ollama direct, if you want it too
      # - "127.0.0.1:3080:3080"               # dsh Web UI, if run in-namespace
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 5

  yardmaster-init:
    image: alpine:latest
    container_name: yardmaster-init
    command: sh -c "chown -R 10001:10001 /data"
    volumes:
      - yardmaster-data:/data

  yardmaster:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: docker/Dockerfile
      target: runtime-proxy
    image: yardmaster:proxy-local
    container_name: yardmaster
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster-init: { condition: service_completed_successfully }
      ollama: { condition: service_healthy }
    environment:
      NVPAIR_LOG_LEVEL: info
      YM_DATAPLANE_MODE: proxy
      YM_LOCAL_ENGINE_URL: http://127.0.0.1:11434
      YM_HEALTHCHECK_URL: http://127.0.0.1:11435/api/tags
    volumes:
      - yardmaster-data:/data

  yardmaster-console:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: packages/yardmaster-console/Dockerfile
    image: yardmaster-console:local
    container_name: yardmaster-console
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster: { condition: service_started }
    environment:
      YM_CONSOLE_PORT: "8770"
      YM_CONSOLE_BIND: 0.0.0.0
      YM_LOCAL_ENGINE_URL: http://127.0.0.1:11434
      YM_AGENT_URL: http://127.0.0.1:3080
      YM_CONFIG_PATH: /config/yardmaster.toml
      YM_CONFIG_FALLBACK: "/data/Nvidia Corporation/Personal AI Router/yardmaster.toml"
      YM_METRICS_DB: "/data/Nvidia Corporation/Personal AI Router/yardmaster-metrics.db"
    volumes:
      - yardmaster-data:/data
      # To pin yardmaster.toml from the host: create the file first
      # (`sudo install -Dm644 /dev/null /etc/yardmaster/yardmaster.toml`), then
      # uncomment. Keep :ro,Z so SELinux relabels it. If it does not exist,
      # Docker would create a directory here and the Console read fails.
      # - /etc/yardmaster/yardmaster.toml:/config/yardmaster.toml:ro,Z

volumes:
  ollama-models: { name: yardmaster-ollama-models }
  yardmaster-data: { name: yardmaster-data }
