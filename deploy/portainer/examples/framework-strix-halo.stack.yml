#
# Yardmaster on a Framework Desktop (AMD Ryzen AI Max+ 395 / "Strix Halo",
# Radeon 8060S iGPU, 128 GB unified memory), Fedora 43/44.
#
# THREE containers, zero manual steps:
#
#   ollama              the GPU engine (ROCm). Owns the network namespace; every
#                       published port is declared here.
#   yardmaster          the PAIR broker + proxy + the interim router (:4000,
#                       config-driven autorouting) + the Yardmaster Console + a
#                       LAN bridge. Self-chowns its volume and drops to uid 10001.
#   yardmaster-harness  `dsh web` (DeepSeek Harness), auto-pointed at the router,
#                       behind a Basic-Auth reverse proxy. Kept separate because
#                       it runs model-generated code.
#
# Ports (published on `ollama`):
#   11435  -> LAN bridge -> 127.0.0.1:4000 router   inference clients (autorouting)
#    8770  -> Yardmaster Console                     ${YM_BIND}
#    3080  -> Harness auth proxy -> dsh              ${YM_BIND}
#
# ---- stack environment variables (Portainer > Stack > Environment, or .env) ----
#   YM_BIND          127.0.0.1 (default) | 0.0.0.0   expose Console + Harness to the LAN
#   YM_LAN_HOST      e.g. 10.116.2.145               added to dsh's --trusted-host
#   YM_LAN_HOSTNAME  e.g. framework                   a DNS/mDNS hostname, if you browse by
#                                                    name instead of IP — also added to
#                                                    --trusted-host (dsh's Host/Origin fence
#                                                    checks the literal authority you typed;
#                                                    without this, "http://framework:3080"
#                                                    loads the page but the agent UI shows
#                                                    "Disconnected", 403 on every /api call)
#   YM_HARNESS_DEFAULT_MODEL deepseek-r1:32b (default)  Harness default model (fallback for
#                                                    [harness].default_model in yardmaster.toml)
#   YM_AUTH_USER / YM_AUTH_PASS                      pre-seed the admin login; if unset,
#                                                    the Console shows a one-time setup page
#                                                    and nothing works until you set one
#   YM_AUTH_DISABLED 1                               turn auth OFF (loopback-dev only)
#   OPENROUTER_API_KEY                               used by the OpenRouter targets in yardmaster.toml
#
# AUTH IS ON BY DEFAULT. One admin credential (scrypt hash on the data volume,
# survives restarts) protects BOTH the Console and the Harness. Do the first-run
# setup from the host (YM_BIND=127.0.0.1), then set YM_BIND=0.0.0.0 and redeploy.

services:
  ollama:
    image: docker.io/ollama/ollama:rocm
    container_name: yardmaster-ollama
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "39"        # video   -- verify: getent group video render
      - "105"       # render
    ipc: host
    # security_opt: ["seccomp=unconfined"]   # only if rocminfo fails on a syscall
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"          # loopback in the shared namespace
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "3"
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_FLASH_ATTENTION: "1"
      # REQUIRED on this iGPU. Without it Ollama auto-picks a huge "vram-based
      # default context" (262144 -> a ~56 GB KV cache) and inference on the
      # Radeon 8060S returns fluent-but-wrong gibberish. 16384 is plenty for the
      # Harness agent prompt; raise only if you need long context and output
      # stays coherent.
      OLLAMA_CONTEXT_LENGTH: "16384"
      # HSA_OVERRIDE_GFX_VERSION: "11.0.0"    # try if inference still degrades (forces the gfx1100 codepath)
    ports:
      - "11435:11430"                              # inference proxy -> LAN (plaintext)
      - "${YM_BIND:-127.0.0.1}:8770:8770"          # Yardmaster Console
      - "${YM_BIND:-127.0.0.1}:3080:3081"          # DeepSeek Harness
      # - "11434:11434"                            # Ollama direct, if you want it too
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 5

  yardmaster:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: docker/Dockerfile
      target: runtime-proxy
    image: yardmaster:proxy-local
    pull_policy: build             # this image is built here, never pulled from a registry
    container_name: yardmaster
    restart: unless-stopped
    network_mode: "service:ollama"
    user: "0:0"                     # start as root to chown the volume, then drop to 10001
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      NVPAIR_LOG_LEVEL: info
      # router = PAIR proxy workers + the interim Node data plane (config-driven
      # autorouting across local / LAN / OpenRouter by model id, passthrough +
      # escalation routes, metrics). `proxy` = local-only, no autorouting.
      YM_DATAPLANE_MODE: router
      YM_ROUTER_PORT: "4000"
      YM_ROUTER_BIND: 127.0.0.1        # 0.0.0.0 also exposes autorouting (incl. cloud egress) to the LAN via :11435
      YM_LOCAL_ENGINE_URL: http://127.0.0.1:11434
      YM_PROXY_PORT: "11435"
      YM_LAN_BRIDGE_PORT: "11430"
      YM_HEALTHCHECK_URL: http://127.0.0.1:4000/healthz
      # Console
      YM_CONSOLE_PORT: "8770"
      YM_CONSOLE_BIND: 0.0.0.0
      YM_AGENT_PORT: "3080"                          # where the Console points browsers for the Harness
      YM_HARNESS_URL_FILE: /dshhome/web-url
      YM_CONFIG_PATH: /config/yardmaster.toml
      YM_CONFIG_FALLBACK: "/data/Nvidia Corporation/Personal AI Router/yardmaster.toml"
      YM_METRICS_DB: "/data/Nvidia Corporation/Personal AI Router/yardmaster-metrics.db"
      # Capability registry (ADR-0028): discovers the Harness's model list from
      # yardmaster.toml + live provider probes, writes it into cordis.patch.yml.
      # Prefer [harness].default_model in the TOML; this is only a fallback.
      YM_HARNESS_DEFAULT_MODEL: "${YM_HARNESS_DEFAULT_MODEL:-deepseek-r1:32b}"
      # Auth (shared with the Harness). Leave USER/PASS empty for the setup page.
      YM_AUTH_USER: "${YM_AUTH_USER:-}"
      YM_AUTH_PASS: "${YM_AUTH_PASS:-}"
      YM_AUTH_DISABLED: "${YM_AUTH_DISABLED:-}"
      # Provider keys for yardmaster.toml (never written to the file).
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    volumes:
      - yardmaster-data:/data
      - yardmaster-harness:/dshhome                 # rw: writes the Harness's model list (ADR-0028)
      # Manage yardmaster.toml from the host (keep :ro,Z for SELinux). Create the
      # file first: sudo install -Dm644 deploy/portainer/yardmaster.toml.example \
      #   /etc/yardmaster/yardmaster.toml
      # - /etc/yardmaster/yardmaster.toml:/config/yardmaster.toml:ro,Z

  yardmaster-harness:
    build:                              # same image as `yardmaster` — Compose builds it once
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: docker/Dockerfile
      target: runtime-proxy
    image: yardmaster:proxy-local        # bundles node + dsh + the auth proxy
    pull_policy: build
    container_name: yardmaster-harness
    restart: unless-stopped
    network_mode: "service:ollama"
    user: "0:0"
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/yardmaster-harness-entrypoint"]
    depends_on:
      ollama: { condition: service_healthy }
      yardmaster: { condition: service_healthy }   # router up -> model discovery works
    environment:
      DSH_HOME: /dshhome
      YM_HARNESS_PORT: "3080"
      YM_HARNESS_PROXY_PORT: "3081"
      YM_HARNESS_TRUSTED_HOSTS: "127.0.0.1:3080${YM_LAN_HOST:+ ${YM_LAN_HOST}:3080}${YM_LAN_HOSTNAME:+ ${YM_LAN_HOSTNAME}:3080}"
      # No model config here — the `yardmaster` container's capability
      # registry (ADR-0028) writes the Harness's model list directly into this
      # volume. Set the default via [harness].default_model in yardmaster.toml,
      # or YM_HARNESS_DEFAULT_MODEL on the `yardmaster` service.
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"          # for the Brave Search MCP server (see docs; cordis.user.yml)
      YM_AUTH_USER: "${YM_AUTH_USER:-}"
      YM_AUTH_PASS: "${YM_AUTH_PASS:-}"
    volumes:
      - yardmaster-harness:/dshhome
      - yardmaster-data:/data:ro                    # read the shared admin credential

volumes:
  ollama-models: { name: yardmaster-ollama-models }
  yardmaster-data: { name: yardmaster-data }
  yardmaster-harness: { name: yardmaster-harness }
