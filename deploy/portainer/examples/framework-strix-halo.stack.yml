#
# Yardmaster + ROCm Ollama + Console + DeepSeek Harness on a Framework Desktop
# (AMD Ryzen AI Max+ 395 / "Strix Halo", Radeon 8060S iGPU, 128 GB unified
# memory), Fedora 43/44.
#
# GPU-tuned variant of deploy/portainer/yardmaster-node.stack.yml. Read
# docs/deployment-framework-strix-halo.md first (BIOS iGPU-memory carve-out,
# `setsebool container_use_devices`, firewalld; rocminfo reports gfx1100, no override).
#
# Topology: `ollama` owns the network namespace; every other service joins it
# with `network_mode: service:ollama`, so all published ports are declared on
# `ollama`. The `yardmaster` entrypoint registers the local engine as a manual
# node at 127.0.0.1:11434; the proxy stays on 11435.
#
# Ports:
#   11435  -> yardmaster-lan-shim -> 127.0.0.1:11435 proxy   (LAN; plaintext)
#    8770  -> Yardmaster Console                              (${YM_BIND})
#    3080  -> yardmaster-harness-shim -> 127.0.0.1:3080 dsh   (${YM_BIND})
#
# LAN ACCESS: set the stack env var  YM_BIND=0.0.0.0  (default 127.0.0.1) to
# expose the Console and Harness to your LAN, and set  YM_LAN_HOST=<framework-ip>
# so dsh's browser-trust fence accepts that authority. SECURITY: the Console has
# NO auth (anyone who can reach :8770 can rewrite yardmaster.toml) and dsh runs
# model-generated code behind only a launch-token + signed cookie. On a shared
# network put an authenticating reverse proxy in front (see the doc) or restrict
# the source with firewalld.


services:
  ollama:
    image: docker.io/ollama/ollama:rocm
    container_name: yardmaster-ollama
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "39"        # video  -- verify: getent group video render
      - "105"       # render
    ipc: host
    # security_opt: ["seccomp=unconfined"]   # only if rocminfo fails on a syscall
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"          # loopback in the shared namespace
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "3"
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_FLASH_ATTENTION: "1"
      # HSA_OVERRIDE_GFX_VERSION: "11.0.0"    # rocminfo reports gfx1100 (native); only if CPU fallback
    ports:
      - "11435:11430"                              # inference proxy -> LAN
      - "${YM_BIND:-127.0.0.1}:8770:8770"          # Console
      - "${YM_BIND:-127.0.0.1}:3080:3081"          # DeepSeek Harness UI
      # - "11434:11434"                            # Ollama direct, if you want it too
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 5

  yardmaster-init:
    image: alpine:latest
    container_name: yardmaster-init
    command: sh -c "chown -R 10001:10001 /data /dshhome"
    volumes:
      - yardmaster-data:/data
      - yardmaster-harness:/dshhome

  yardmaster:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: docker/Dockerfile
      target: runtime-proxy
    image: yardmaster:proxy-local
    container_name: yardmaster
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster-init: { condition: service_completed_successfully }
      ollama: { condition: service_healthy }
    environment:
      NVPAIR_LOG_LEVEL: info
      YM_DATAPLANE_MODE: proxy
      YM_LOCAL_ENGINE_URL: http://127.0.0.1:11434
      YM_HEALTHCHECK_URL: http://127.0.0.1:11435/api/tags
    volumes:
      - yardmaster-data:/data

  # Bridges the proxy's loopback-only plaintext ingress to the LAN: LAN clients
  # hit host :11435 -> here :11430 -> a fresh 127.0.0.1:11435 connection, which
  # the proxy accepts. Without this, non-loopback plaintext gets 403 by design.
  yardmaster-lan-shim:
    image: alpine/socat:latest
    container_name: yardmaster-lan-shim
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster: { condition: service_started }
    command: ["-d", "TCP-LISTEN:11430,fork,reuseaddr", "TCP:127.0.0.1:11435"]

  # DeepSeek Harness Web UI. dsh binds 127.0.0.1 only (it executes model code and
  # refuses 0.0.0.0). The entrypoint captures dsh's announced URL (with its
  # per-boot launch token) to $DSH_HOME/web-url so the Console can link to the
  # current one. DSH_HOME is a dedicated volume: sessions, credentials, and the
  # signed-cookie secret persist, so the browser session survives restarts (you
  # only paste the tokened URL once per browser).
  yardmaster-harness:
    image: yardmaster:proxy-local        # already bundles dsh + node — no separate build
    container_name: yardmaster-harness
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster-init: { condition: service_completed_successfully }
      yardmaster: { condition: service_started }
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/yardmaster-harness-entrypoint"]
    environment:
      DSH_HOME: /dshhome
      YM_HARNESS_PORT: "3080"
      YM_HARNESS_TRUSTED_HOSTS: "127.0.0.1:3080 ${YM_LAN_HOST:-}:3080"
      # Point dsh's default model at the Yardmaster proxy without touching its UI:
      # YM_HARNESS_EXTRA_ARGS: "--set agent-default-model.provider=openai --set agent-default-model.model=llama3.2:latest"
    volumes:
      - yardmaster-harness:/dshhome

  # dsh binds loopback only, so a published port can't reach it directly — this
  # socat sidecar (same namespace) forwards 3081 -> 127.0.0.1:3080.
  yardmaster-harness-shim:
    image: alpine/socat:latest
    container_name: yardmaster-harness-shim
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster-harness: { condition: service_started }
    command: ["-d", "TCP-LISTEN:3081,fork,reuseaddr", "TCP:127.0.0.1:3080"]

  yardmaster-console:
    build:
      context: "https://github.com/pakgrou-porg/yardmaster.git#main"
      dockerfile: packages/yardmaster-console/Dockerfile
    image: yardmaster-console:local
    container_name: yardmaster-console
    restart: unless-stopped
    network_mode: "service:ollama"
    depends_on:
      yardmaster: { condition: service_started }
      yardmaster-harness: { condition: service_started }
    environment:
      YM_CONSOLE_PORT: "8770"
      YM_CONSOLE_BIND: 0.0.0.0
      YM_LOCAL_ENGINE_URL: http://127.0.0.1:11434
      YM_AGENT_URL: http://127.0.0.1:3080          # fallback; host is derived from the request
      YM_HARNESS_URL_FILE: /dshhome/web-url
      YM_CONFIG_PATH: /config/yardmaster.toml
      YM_CONFIG_FALLBACK: "/data/Nvidia Corporation/Personal AI Router/yardmaster.toml"
      YM_METRICS_DB: "/data/Nvidia Corporation/Personal AI Router/yardmaster-metrics.db"
    volumes:
      - yardmaster-data:/data
      - yardmaster-harness:/dshhome:ro             # read the current tokened URL
      # To pin yardmaster.toml from the host: create the file first
      # (`sudo install -Dm644 /dev/null /etc/yardmaster/yardmaster.toml`), then
      # uncomment. Keep :ro,Z so SELinux relabels it.
      # - /etc/yardmaster/yardmaster.toml:/config/yardmaster.toml:ro,Z

volumes:
  ollama-models: { name: yardmaster-ollama-models }
  yardmaster-data: { name: yardmaster-data }
  yardmaster-harness: { name: yardmaster-harness }
